<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diani | Asistente de Bases de Datos II</title><style>
:root{--navy:#102e60;--cyan:#00c9ed}*{box-sizing:border-box}body{margin:0;background:transparent !important;font-family:'Times New Roman',Times,serif;background:linear-gradient(120deg,#eff7fc,#e7e5ff);color:#183153}.demo{padding:24px;max-width:850px;margin:auto}.demo h1{color:#102e60}.demo p{font-size:19px}.launcher{position:fixed;right:20px;bottom:16px;z-index:1500;background:transparent;border:0;cursor:pointer;display:flex;align-items:center;gap:5px;filter:drop-shadow(0 5px 12px #102e6055)}.launcher img{width:104px;height:104px;object-fit:contain}.launcher strong{border-radius:24px;background:#102e60;color:white;padding:10px 15px;border:2px solid #00c9ed;font: bold 17px 'Times New Roman',serif}.chatpanel{position:fixed;bottom:132px;right:22px;width:min(390px,calc(100vw - 26px));height:min(610px,calc(100dvh - 155px));z-index:1499;display:none;background:white;border:2px solid #00c9ed;box-shadow:0 12px 38px #102e6055;border-radius:16px;overflow:hidden;flex-direction:column}.chatpanel.open{display:flex}.head{display:flex;align-items:center;gap:10px;padding:11px 13px;color:white;background:#102e60;border-bottom:3px solid #00c9ed}.head img{width:50px;height:50px;object-fit:contain}.head h2{margin:0;font-size:22px}.head small{font-size:13px;color:#c9eaf7}.head button{margin-left:auto;background:transparent;color:white;font-size:26px;border:0;cursor:pointer}.body{padding:10px;display:flex;flex:1;min-height:0;flex-direction:column;gap:8px}.topics{display:flex;gap:6px;flex-wrap:wrap}.topics button{font:14px 'Times New Roman',serif;color:#075c9b;background:#edf9fc;border:1px solid #a9dcea;padding:7px;border-radius:20px;cursor:pointer}.messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;background:#f5f9fc;border-radius:9px;padding:11px;border:1px solid #d5e5f2}.msg{padding:10px 12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:94%;font-size:16px;line-height:1.35}.bot{background:white;border:1px solid #d5e5f2;align-self:start}.user{background:#dff6fd;align-self:end}.msg b{color:#075c9b}form{display:flex;gap:6px}input{min-width:0;flex:1;border:1px solid #b6d4e6;border-radius:9px;padding:11px;font:16px 'Times New Roman',serif}button[type=submit]{background:#075c9b;color:white;border:0;border-radius:9px;padding:8px 12px;font:bold 16px 'Times New Roman',serif;cursor:pointer}.notice{font-size:12px;margin:0;color:#4c6680}@media(max-width:480px){.launcher img{width:82px;height:82px}.launcher strong{font-size:14px}.chatpanel{right:13px;bottom:112px;height:min(540px,calc(100dvh - 132px))}} 
body.widget{background:transparent}body.widget .demo{display:none}body.embedded{background:#fff}body.embedded .demo,body.embedded .launcher{display:none}body.embedded .chatpanel{display:flex;position:relative;inset:auto;width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}body,body.widget{background:transparent !important} .demo{display:none !important}</style></head><body><button class="launcher" id="launcher" aria-expanded="false" aria-controls="chatpanel" aria-label="Abrir chat de Diani"><strong>¿Te ayudo?</strong><img alt="Diani, robot tutora académica" src="diani_avatar.png"></button>
<section class="chatpanel" id="chatpanel" aria-label="Conversación con Diani"><div class="head"><img alt="" src="diani_avatar.png"><div><h2>Diani</h2><small>Tu compañera virtual de aprendizaje</small></div><button id="cerrar" title="Cerrar chat" aria-label="Cerrar">×</button></div><div class="body"><div class="topics" aria-label="Temas de ayuda"><button type="button" data-q="¿Qué es una vista?">Vistas</button><button type="button" data-q="¿Qué es un procedimiento almacenado?">Procedimientos</button><button type="button" data-q="¿Cómo funciona un trigger?">Triggers</button><button type="button" data-q="¿Cómo optimizo consultas SQL?">Optimización</button><button type="button" data-q="¿Cómo hago respaldos?">Respaldos</button><button type="button" data-q="¿Qué son roles y privilegios?">Seguridad</button></div><div class="messages" id="messages" role="log" aria-live="polite"><div class="msg bot"><b>Diani: </b>¡Hola! Soy Diani, tu compañera de aprendizaje. ¿Qué tema de Bases de Datos II quieres practicar hoy?</div></div><form id="chat"><label for="question" style="position:absolute;left:-10000px">Escribe tu pregunta</label><input id="question" maxlength="500" placeholder="Escribe tu pregunta..." required autocomplete="off"><button type="submit">Enviar</button></form><p class="notice">Prototipo con respuestas preconfiguradas. No compartas contraseñas ni datos personales.</p></div></section>
<script>if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embedded');if(new URLSearchParams(location.search).get('widget')==='1')document.body.classList.add('widget');const launch=document.getElementById('launcher'),panel=document.getElementById('chatpanel');function toggle(open){panel.classList.toggle('open',open);launch.setAttribute('aria-expanded',String(open));if(open)document.getElementById('question').focus()}launch.addEventListener('click',()=>toggle(!panel.classList.contains('open')));document.getElementById('cerrar').addEventListener('click',()=>toggle(false));
(function(){'use strict';const msgs=document.getElementById('messages'),input=document.getElementById('question'),form=document.getElementById('chat');const answers=[
{keys:['vista','view'],text:'Una VISTA es una consulta guardada que se utiliza como tabla virtual. Permite simplificar consultas y controlar qué columnas se presentan.\n\nEjemplo orientativo en PostgreSQL:\nCREATE VIEW vista_estudiantes AS\nSELECT id, nombre FROM estudiantes;\n\nPráctica: ¿qué columnas mostrarías para consultar únicamente los nombres de los estudiantes?'},
{keys:['procedimiento','procedure','stored'],text:'Un PROCEDIMIENTO ALMACENADO agrupa instrucciones SQL que se ejecutan cuando se invoca. Es útil para automatizar operaciones repetitivas.\n\nEjemplo en PostgreSQL:\nCREATE PROCEDURE registrar_log(mensaje TEXT)\nLANGUAGE SQL\nAS $$\n  INSERT INTO logs(descripcion) VALUES (mensaje);\n$$;\n\nInvocación: CALL registrar_log(\'Proceso completado\');\n\nAntes de ejecutarlo debes tener la tabla logs creada.'},
{keys:['trigger','disparador'],text:'Un TRIGGER (disparador) ejecuta automáticamente una función cuando ocurre un evento como INSERT, UPDATE o DELETE. En PostgreSQL, normalmente se crea primero la función de disparo y después el trigger.\n\nEjercicio: diseña una tabla auditoria con fecha, operación y usuario. ¿En qué evento registrarías cada modificación de una tabla?'},
{keys:['optimiza','optimización','optimizar','rendimiento','índice','index','cuello de botella','explain'],text:'Para revisar el RENDIMIENTO de una consulta:\n1. Identifica qué tablas y filtros utiliza.\n2. Examina su plan con EXPLAIN (ANALYZE, BUFFERS) en PostgreSQL sobre un entorno de prueba.\n3. Revisa índices apropiados en columnas filtradas o de unión.\n4. Compara tiempos antes y después del cambio.\n\nNo agregues índices indiscriminadamente: también afectan escrituras y almacenamiento.'},
{keys:['respaldo','backup','restaur','recuper','restore'],text:'Un RESPALDO permite recuperar datos después de una pérdida o incidente. Debe acompañarse de pruebas de RESTAURACIÓN.\n\nEn PostgreSQL, pg_dump permite generar una copia lógica. Ejemplo conceptual:\npg_dump -Fc -f respaldo.dump mi_basedatos\n\nEl procedimiento de restauración depende del formato y del destino. Practica únicamente en una base de pruebas y confirma que puedes recuperar los datos.'},
{keys:['rol','privilegio','seguridad','usuario','grant','revoke'],text:'Los ROLES y PRIVILEGIOS permiten controlar quién puede acceder a los objetos de una base de datos.\n\nEjemplo en PostgreSQL:\nGRANT SELECT ON estudiantes TO lector;\nREVOKE SELECT ON estudiantes FROM lector;\n\nEl rol lector debe existir y quien ejecuta estas instrucciones necesita los permisos correspondientes. Principio recomendado: mínimo privilegio.'},
{keys:['error','falla','no funciona','syntax','sintaxis'],text:'Para depurar un ERROR SQL:\n1. Copia el mensaje exacto que muestra el gestor.\n2. Identifica la línea señalada y revisa la instrucción anterior.\n3. Comprueba nombres de tablas, columnas y tipos de datos.\n4. Ejecuta por partes en una base de pruebas.\n5. Confirma si utilizas PostgreSQL, SQL Server u otro motor, porque la sintaxis puede variar.\n\nSi necesitas revisión específica de un error nuevo, consulta a la docente o usa un servicio de IA conectado.'},
{keys:['hola','buenas','ayuda','temas'],text:'¡Hola! Puedo explicar: vistas, procedimientos almacenados, triggers, índices y rendimiento, roles y privilegios, respaldos y restauración. Elige uno de los botones superiores para comenzar.'}
];function add(who,content){const el=document.createElement('div');el.className='msg '+who;const bold=document.createElement('b');bold.textContent=who==='bot'?'Diani: ':'Tú: ';el.appendChild(bold);el.appendChild(document.createTextNode(content));msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight}function normalized(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function respond(q){const t=normalized(q);const a=answers.find(item=>item.keys.some(k=>t.includes(normalized(k))));return a?a.text:'Todavía no tengo una respuesta preconfigurada para esa pregunta. Puedes consultar vistas, procedimientos almacenados, triggers, optimización, respaldos o roles y privilegios. Para responder libremente sobre nuevos temas es necesario conectar un modelo de IA mediante un servicio seguro.'}function ask(q){if(!q.trim())return;add('user',q.trim());add('bot',respond(q));input.value=''}form.addEventListener('submit',e=>{e.preventDefault();ask(input.value)});document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>ask(b.getAttribute('data-q'))));})();
</script></body></html>
